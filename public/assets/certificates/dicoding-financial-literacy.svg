<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Certificate Paper Background -->
  <rect width="1000" height="680" rx="16" fill="#FFFFFF"/>
  
  <!-- Outer & Inner Borders -->
  <rect x="24" y="24" width="952" height="632" rx="12" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="36" y="36" width="928" height="608" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- Left Side Accent Strip -->
  <path d="M 36 36 L 44 36 L 44 644 L 36 644 Z" fill="#2B3990"/>

  <!-- Dicoding Logo Top Left -->
  <g transform="translate(68, 64)">
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" fill="#2B3990" letter-spacing="-1">dicoding</text>
    <circle cx="140" cy="-6" r="4" fill="#EF4444"/>
  </g>

  <!-- Ribbon Top Right (Kompetensi Kelulusan 9) -->
  <g transform="translate(770, 36)" filter="url(#shadow)">
    <!-- Ribbon shape -->
    <path d="M 0 0 L 190 0 L 190 190 L 95 155 L 0 190 Z" fill="url(#ribbonGrad)"/>
    <text x="95" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="2">KOMPETENSI</text>
    <text x="95" y="54" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="2">KELULUSAN</text>
    <circle cx="95" cy="100" r="30" fill="none" stroke="#F8FAFC" stroke-width="2"/>
    <text x="95" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#F8FAFC" text-anchor="middle">9</text>
  </g>

  <!-- Certificate Heading -->
  <text x="500" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#64748B" text-anchor="middle" letter-spacing="4">SERTIFIKAT KOMPETENSI</text>
  <text x="500" y="244" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#94A3B8" text-anchor="middle">Diberikan kepada</text>

  <!-- Recipient Name -->
  <text x="500" y="304" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#0F172A" text-anchor="middle">Muhammad Daffa Rezky</text>
  <line x1="280" y1="324" x2="720" y2="324" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Course Completion Text -->
  <text x="500" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#64748B" text-anchor="middle">Atas kelulusannya pada kelas</text>
  
  <text x="500" y="408" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#1E40AF" text-anchor="middle">Dasar-Dasar Literasi Keuangan</text>
  <text x="500" y="438" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#3B82F6" text-anchor="middle">Financial Literacy Fundamentals</text>

  <!-- Date -->
  <text x="500" y="480" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748B" text-anchor="middle">23 September 2025</text>

  <!-- Bottom Left: Dicoding Seal & QR Box -->
  <g transform="translate(68, 520)">
    <!-- QR Code Mock -->
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="10" y="10" width="18" height="18" fill="#0F172A"/>
    <rect x="42" y="10" width="18" height="18" fill="#0F172A"/>
    <rect x="10" y="42" width="18" height="18" fill="#0F172A"/>
    <rect x="34" y="34" width="8" height="8" fill="#0F172A"/>
    <rect x="46" y="46" width="14" height="14" fill="#0F172A"/>

    <g transform="translate(86, 12)">
      <text font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#475569">Verifikasi Sertifikat Resmi</text>
      <text y="18" font-family="monospace" font-size="10" fill="#94A3B8">dicoding.com/certificates/MDR-2025</text>
      <text y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#10B981" font-weight="700">✓ TERVALIDASI RESMI</text>
    </g>

    <!-- Dicoding Logo Badge -->
    <g transform="translate(0, 84)">
      <rect width="130" height="28" rx="14" fill="#2B3990"/>
      <text x="65" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DICODING</text>
    </g>
  </g>

  <!-- Bottom Right: Signatures -->
  <g transform="translate(730, 520)">
    <!-- Signature simulation path -->
    <path d="M 20 45 Q 40 10 70 35 T 120 25 T 160 40 T 190 20" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="65" x2="200" y2="65" stroke="#94A3B8" stroke-width="1"/>
    <text x="105" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0F172A" text-anchor="middle">Narenda Wicaksono</text>
    <text x="105" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Chief Executive Officer</text>
    <text x="105" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Dicoding Indonesia</text>
  </g>
</svg>
